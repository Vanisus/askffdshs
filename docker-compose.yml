x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

services:
  model-init:
    build: *app-build
    image: siem-enrichment:latest
    command: ["python", "-m", "app.warmup"]
    volumes:
      - hf-cache:/opt/hf-cache
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_HUB_DOWNLOAD_TIMEOUT: 600
    restart: "no"

  siem-enrichment:
    build: *app-build
    image: siem-enrichment:latest
    depends_on:
      model-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/opt/hf-cache
      - ./app/data:/app/app/data:ro
    env_file:
      - .env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      SIEM_INFERENCE_CONCURRENCY: 1
      SIEM_BATCH_MAX_SIZE: 100
      SIEM_REQUEST_TIMEOUT_SECONDS: 30
      SIEM_RESULT_CACHE_SIZE: 10000
      SIEM_RESULT_CACHE_TTL_SECONDS: 300
      SIEM_RERANK_SCORE_THRESHOLD: 0.35
      SIEM_RERANK_MIN_GAP: 0.05
      SIEM_MAX_AUTO_TECHNIQUES: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    stop_grace_period: 30s

volumes:
  hf-cache:
